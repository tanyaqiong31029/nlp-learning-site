name: Auto update resource data

on:
  schedule:
    - cron: "17 2 * * *" # 每日 02:17 UTC = 北京时间 10:17
  workflow_dispatch:

permissions:
  contents: write # 提交数据更新
  actions: write # 触发 Pages 重新部署

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 核验并更新资源数据
        run: node scripts/update-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 数据 schema 校验（不过则不提交）
        run: node scripts/validate-data.mjs

      - name: 提交数据更新（有变化才提交）
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "bot: 每日自动核验资源数据（星标/活跃度/近期动态）"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发 Pages 重新部署
        if: steps.commit.outputs.changed == 'true'
        run: |
          gh api -X POST repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches -f ref=main
        env:
          GH_TOKEN: ${{ github.token }}
